<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.5.10/dist/typography.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root { --primary: #4f46e5; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; scroll-behavior: smooth; overflow-x: hidden; }

        /* 回归简单卡片风格 */
        .simple-card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .canvas-container { position: relative; width: 100%; height: 240px; cursor: crosshair; touch-action: none; background: #fff; border-radius: 0.5rem; }
        .hidden-view { display: none; opacity: 0; }
        .view-content { transition: opacity 0.2s ease-in-out; }
        
        /* 文章内容显示 */
        .content-body img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1.5rem 0; display: block; border: 1px solid #e2e8f0; }
        .content-body a { color: var(--primary); text-decoration: underline; font-weight: 600; }
        
        .article-card { transition: transform 0.2s, box-shadow 0.2s; }
        .article-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

        .number-input { @apply bg-slate-50 border border-slate-200 rounded-md text-sm font-semibold text-indigo-600 outline-none focus:ring-2 focus:ring-indigo-500/20 p-2.5 w-full; }
    </style>
</head>
<body class="text-slate-800 antialiased text-left">

    <!-- 简单导航栏 -->
    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 py-4 px-6 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex flex-col cursor-pointer" onclick="window.showView('home')">

                <a id="nav-admin-link" href="javascript:void(0)" onclick="window.checkAdminAuth()" class="text-sm font-medium text-slate-600 hover:text-indigo-600">管理</a>
                <a id="nav-contact-btn" href="#" target="_blank" class="bg-indigo-600 text-white px-4 py-1.5 rounded-md text-sm font-bold hover:bg-indigo-700">联系我</a>

    <!-- 管理员登录弹窗 -->
    <div id="auth-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">

    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8 pb-20">

                    ← 返回列表
                </button>
                <div class="simple-card p-8 md:p-12">
                    <div id="article-detail-content" class="prose prose-slate max-w-none content-body"></div>
                </div>
                <!-- 互动评论 -->
                <div class="simple-card p-8 space-y-8">
                    <h3 class="text-xl font-bold">互动交流</h3>
                    <div class="space-y-4 bg-slate-50 p-6 rounded-lg border border-slate-200">
                        <input type="text" id="comment-name" placeholder="您的称呼" class="w-full md:w-1/2 p-3 border border-slate-200 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <textarea id="comment-content" rows="3" maxlength="2000" placeholder="写下你的想法..." class="w-full p-3 border border-slate-200 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                        <input type="text" id="comment-website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden">
                        <button onclick="window.submitComment()" id="comment-submit-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-md font-bold text-sm">发表评论</button>
                    </div>

            </div>

            <!-- 管理后台 -->
            <div id="admin-view" class="view-content hidden-view space-y-8">
                <div class="flex justify-between items-center simple-card p-6">
                    <h2 class="text-xl font-bold">管理控制台</h2>
                    <div class="flex gap-2">
                        <button onclick="window.logoutAdmin()" class="px-4 py-1.5 bg-slate-100 text-slate-500 rounded-md text-xs font-bold">注销</button>
                        <button onclick="window.openEditor()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-md text-xs font-bold">+ 新建内容</button>

                    <h3 class="text-sm font-bold text-indigo-600 uppercase tracking-wider">站点配置</h3>

                        </div>
                        <div class="md:col-span-2 space-y-1">
                            <label class="text-xs text-slate-400 font-bold">主页大标题</label>
                            <input type="text" id="set-welcome-title" class="w-full p-3 border border-slate-200 rounded-md outline-none font-bold">
                        </div>
                        <div class="md:col-span-2 space-y-1">
                            <label class="text-xs text-slate-400 font-bold">个人简介</label>
                            <textarea id="set-welcome-desc" rows="2" class="w-full p-3 border border-slate-200 rounded-md outline-none"></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs text-slate-400 font-bold">标签 1</label>
                            <input type="text" id="set-tag1" class="w-full p-3 border border-slate-200 rounded-md outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs text-slate-400 font-bold">标签 2</label>
                            <input type="text" id="set-tag2" class="w-full p-3 border border-slate-200 rounded-md outline-none">
                        </div>
                    </div>
                    <button onclick="window.saveSettings()" id="save-settings-btn" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-md">保存并同步</button>
                </div>
                <div id="admin-table-body" class="simple-card overflow-hidden"></div>
            </div>

            <!-- 编辑器 -->
            <div id="editor-view" class="view-content hidden-view space-y-8">
                <div class="simple-card p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">内容工作室</h3>
                        <div class="flex gap-2">
                            <label class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded cursor-pointer">贴图<input type="file" id="image-upload" accept="image/*" class="hidden"></label>
                            <label class="px-3 py-1 bg-emerald-50 text-emerald-600 text-xs font-bold rounded cursor-pointer">附件<input type="file" id="file-upload" accept=".pdf,.doc,.docx,.xls,.xlsx,.zip,.txt" class="hidden"></label>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <input type="hidden" id="edit-id">
                        <input type="text" id="post-title" placeholder="博文标题" class="w-full p-4 border border-slate-200 rounded-md outline-none text-xl font-bold">
                        <textarea id="post-summary" placeholder="首页摘要..." rows="2" class="w-full p-4 border border-slate-200 rounded-md outline-none font-medium text-slate-500"></textarea>
                        <textarea id="post-content" placeholder="记录你的奋斗 (支持直接粘贴图片)..." rows="18" class="w-full p-6 border border-slate-200 rounded-md outline-none font-mono text-base leading-relaxed"></textarea>
                        <div class="flex gap-4 pt-4">
                            <button type="button" onclick="window.submitPost()" id="post-submit-btn" class="flex-[2] bg-indigo-600 text-white py-3 rounded-md font-bold">发布同步</button>
                            <button type="button" onclick="window.showView('admin')" class="flex-1 bg-slate-100 text-slate-500 py-3 rounded-md font-bold">取消返回</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div class="lg:col-span-1 space-y-8">
            <!-- 倒计时 -->
            <div class="bg-slate-800 text-white p-8 rounded-2xl shadow-lg relative overflow-hidden">
                <h3 class="text-sm font-bold mb-4 text-slate-400">2026 奋斗进度</h3>
                <div class="text-5xl font-bold mb-6 tabular-nums" id="countdown">...</div>
                <div class="w-full bg-slate-700 rounded-full h-2 mb-4">
                    <div id="progress-bar" class="bg-indigo-500 h-full rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
                </div>
                <p class="text-[10px] text-slate-400" id="progress-text">同步中...</p>
            </div>

            <!-- 复利模拟器 -->
            <div class="simple-card p-8 space-y-8">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-900">复利模拟器</h3>
                    <span class="text-[9px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-400">V2.2</span>
                </div>
                <div class="canvas-container">
                    <canvas id="compoundCanvas"></canvas>
                    <div id="chart-tooltip" class="absolute hidden pointer-events-none bg-slate-900/95 text-white text-[11px] p-4 rounded-lg shadow-xl z-20 border border-white/10 min-w-[170px]"></div>
                </div>
                <!-- 修复：将输入框改为垂直堆叠，彻底解决重叠问题 -->
                <div class="space-y-5">
                    <div class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400">初始本金 (¥)</label>
                            <input type="number" id="inputPrincipal" value="10000" class="number-input">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400">每月定投 (¥)</label>
                            <input type="number" id="inputMonthly" value="2000" class="number-input">
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-xs font-bold">
                            <span class="text-slate-400">投资年限</span>
                            <span class="text-indigo-600"><span id="yearsVal">20</span>年</span>
                        </div>
                        <input type="range" id="yearsInput" min="1" max="40" value="20" class="w-full h-1.5 bg-slate-100 rounded-lg cursor-pointer">
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-xs font-bold">
                            <span class="text-slate-400">年化收益</span>
                            <span class="text-indigo-600"><span id="rateVal">8</span>%</span>
                        </div>
                        <input type="range" id="rateInput" min="1" max="15" value="8" class="w-full h-1.5 bg-slate-100 rounded-lg cursor-pointer">
                    </div>
                </div>
                <div class="pt-6 border-t border-slate-50 text-center">
                    <div class="text-[10px] text-slate-400 mb-1 font-bold uppercase tracking-widest">预期最终资产</div>
                    <div class="text-3xl font-bold text-indigo-600 tabular-nums" id="finalWealth">...</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // 管理权限由 Firebase Authentication 和 Firestore 安全规则验证，绝不在前端保存密码。
        const adminProvider = new GoogleAuthProvider();
        const fbConfig = { apiKey: "AIzaSyAVxcXzx1rxI1R6MaUpvwkhsJA5tFCmlKU", authDomain: "blog-6dd2d.firebaseapp.com", projectId: "blog-6dd2d", storageBucket: "blog-6dd2d.firebasestorage.app", messagingSenderId: "232992420063", appId: "1:232992420063:web:4afa71559dbf14ed47f96a", measurementId: "G-JV2BY25CFH" };
        const app = initializeApp(fbConfig); const auth = getAuth(app); const db = getFirestore(app); const storage = getStorage(app); const appId = 'blog-6dd2d';
        const articlesCol = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
        const settingsDoc = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main');
        const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'comments');

        let isAdminAuthenticated = false, articles = [], comments = [], currentArticleId = null, user = null, securityRecord = null;
        window.tempMediaMap = {};

        // --- 认证 ---
        window.loginAdmin = async () => {
            try {
                await signInWithPopup(auth, adminProvider);
                isAdminAuthenticated = true;
                window.closeAuthModal();
                window.showView('admin');
            } catch (error) {
                // Some browsers block pop-ups; a redirect works reliably there.
                if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error.code)) {
                    await signInWithRedirect(auth, adminProvider);
                    return;
                }
                console.error('管理员登录失败', error);
                alert('登录未完成：' + (error.code || '请确认已启用 Google 登录并授权博客域名。'));
            }
        };
        window.checkAdminAuth = () => {
            if (isAdminAuthenticated) return window.showView('admin');
            const modal = document.getElementById('auth-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
        };
        window.closeAuthModal = () => { const modal = document.getElementById('auth-modal'); modal?.classList.add('hidden'); modal?.classList.remove('flex'); };
        window.logoutAdmin = async () => { await signOut(auth); await signInAnonymously(auth); isAdminAuthenticated = false; window.showView('home'); };

        const escapeHTML = (value = '') => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
        const safeUrl = (value = '', image = false) => {
            try {
                const url = String(value).trim();
                if (image && /^data:image\/(png|jpe?g|gif|webp);base64,/i.test(url)) return url;
                const parsed = new URL(url, location.origin);
                const allowedProtocols = image ? ['https:', 'http:'] : ['https:', 'http:', 'mailto:'];
                return allowedProtocols.includes(parsed.protocol) ? parsed.href : '';
            } catch { return ''; }
        };
        const sanitizeArticleHTML = (html = '') => {
            const allowed = new Set(['P','BR','STRONG','EM','B','I','U','H1','H2','H3','H4','UL','OL','LI','BLOCKQUOTE','PRE','CODE','A','IMG']);
            const parsed = new DOMParser().parseFromString(String(html), 'text/html');
            parsed.body.querySelectorAll('*').forEach(element => {
                if (!allowed.has(element.tagName)) { element.replaceWith(...element.childNodes); return; }
                const href = element.getAttribute('href'), source = element.getAttribute('src');
                [...element.attributes].forEach(attribute => element.removeAttribute(attribute.name));
                if (element.tagName === 'A') { const safeHref = safeUrl(href); if (safeHref) { element.setAttribute('href', safeHref); element.setAttribute('target', '_blank'); element.setAttribute('rel', 'noopener noreferrer'); } else element.replaceWith(...element.childNodes); }
                if (element.tagName === 'IMG') { const safeSource = safeUrl(source, true); if (safeSource) { element.setAttribute('src', safeSource); element.setAttribute('alt', '文章图片'); } else element.remove(); }
            });
            return parsed.body.innerHTML;
        };

        // --- 路由 ---
        window.showView = (v, id = null) => { location.hash = `#/${v}${id ? '/' + id : ''}`; };
        const updateUIFromHash = () => {
            const parts = location.hash.replace(/^#\//, '').split('/');
            const view = parts[0] || 'home', id = parts[1] || null;
            const isAuth = isAdminAuthenticated;
            if ((view === 'admin' || view === 'editor') && !isAuth) { location.hash = '#/home'; window.checkAdminAuth(); return; }
            ['home', 'article', 'admin', 'editor'].forEach(x => document.getElementById(x + '-view')?.classList.add('hidden-view'));
            const target = document.getElementById(view + '-view'); if(target) target.classList.remove('hidden-view');
            if (view === 'article' && id) {
                currentArticleId = id; const a = articles.find(x => x.id === id);
                if(a) { 
                    document.getElementById('article-detail-content').innerHTML = `<h1 class="text-3xl font-bold mb-4">${escapeHTML(a.title)}</h1><div class="text-slate-400 text-xs mb-8">📅 发布时间：${escapeHTML(a.date)}</div><div class="content-body text-base leading-relaxed">${sanitizeArticleHTML(a.content)}</div>`;
                    renderComments();
                }
            } else currentArticleId = null;
            window.scrollTo(0, 0);
        };
        window.addEventListener('hashchange', updateUIFromHash);

        // --- 数据 ---
        function startSettingsListener() {
            onSnapshot(settingsDoc, s => {
                const d = s.exists() ? s.data() : {};
                document.getElementById('nav-site-title').innerText = d.siteTitle || 'STRIVE 2026';
                document.getElementById('welcome-title').innerText = d.welcomeTitle || '你好 👋';
                document.getElementById('welcome-desc').innerText = d.welcomeDesc || '同步云端中...';
                const mapping = {'set-site-title':'siteTitle','set-welcome-title':'welcomeTitle','set-welcome-desc':'welcomeDesc','set-contact-link':'contactLink','set-tag1':'tag1','set-tag2':'tag2'};
                for (let [id, key] of Object.entries(mapping)) { const el = document.getElementById(id); if(el) el.value = d[key] || ''; }
                const tagsEl = document.getElementById('welcome-tags'); if(tagsEl) tagsEl.innerHTML = `<span class="px-3 py-1 bg-white border border-slate-200 text-indigo-600 text-[10px] font-bold rounded-md shadow-sm">${escapeHTML(d.tag1 || '# 2026考研')}</span><span class="px-3 py-1 bg-white border border-slate-200 text-emerald-600 text-[10px] font-bold rounded-md shadow-sm">${escapeHTML(d.tag2 || '# 奋斗')}</span>`;
                const contactBtn = document.getElementById('nav-contact-btn'); if(contactBtn) { let url = (d.contactLink || '').trim(); if(url && !url.startsWith('http')) url = 'https://' + url; contactBtn.href = url || '#'; }
            });
        }
        window.saveSettings = async () => {
            const btn = document.getElementById('save-settings-btn'); btn.innerText = "正在同步..."; btn.disabled = true;
            try { await setDoc(settingsDoc, { siteTitle: document.getElementById('set-site-title').value, welcomeTitle: document.getElementById('set-welcome-title').value, welcomeDesc: document.getElementById('set-welcome-desc').value, contactLink: document.getElementById('set-contact-link').value, tag1: document.getElementById('set-tag1').value, tag2: document.getElementById('set-tag2').value }); btn.innerText = "成功同步"; setTimeout(()=> { btn.disabled=false; btn.innerText = "保存并同步"; }, 2000); } catch(e) { btn.disabled = false; }
        };
        function startDataListener() {
            onSnapshot(articlesCol, s => {
                articles = s.docs.map(d => ({id: d.id, ...d.data()}));
                articles.sort((a, b) => {
                    if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
                    const timeA = a.updatedAt?.toMillis() || new Date(a.date?.replace(/\./g,'-').replace(/\s.+/,'')).getTime() || 0;
                    const timeB = b.updatedAt?.toMillis() || new Date(b.date?.replace(/\./g,'-').replace(/\s.+/,'')).getTime() || 0;
                    return timeB - timeA;
                });
                document.getElementById('article-list').innerHTML = articles.map(a => {
                    const imgMatch = String(a.content || '').match(/<img[^>]+src="([^">]+)"/i);
                    const firstImg = imgMatch ? safeUrl(imgMatch[1], true) : '';
                    return `<div onclick="window.showView('article', '${a.id}')" class="article-card simple-card p-8 cursor-pointer relative overflow-hidden text-left"><div class="flex flex-col sm:flex-row justify-between gap-6 text-left"><div class="flex-1 min-w-0 text-left">${a.isPinned ? '<span class="inline-block mb-3 bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">置顶</span>' : ''}<h4 class="text-xl font-bold mb-2 group-hover:text-indigo-600 transition-colors text-left">${escapeHTML(a.title)}</h4><p class="text-slate-500 line-clamp-2 text-sm leading-relaxed mb-4 text-left">${escapeHTML(a.summary)}</p><div class="flex items-center gap-6 text-left"><span class="text-slate-400 text-[10px] font-bold">📅 ${escapeHTML((a.date || '').split(' ')[0])}</span><div class="text-indigo-600 text-[10px] font-bold">阅读全文 →</div></div></div>${firstImg ? `<div class="w-full sm:w-32 sm:h-32 h-44 shrink-0 rounded-lg overflow-hidden border border-slate-100"><img src="${escapeHTML(firstImg)}" alt="" class="w-full h-full object-cover"></div>` : ''}</div></div>`;
                }).join('');
                document.getElementById('admin-table-body').innerHTML = `<div class="p-4 font-bold text-[10px] uppercase border-b border-slate-100 text-slate-400">博文列表管理</div>` + articles.map(a => {
                    const safeId = escapeHTML(a.id);
                    return `<div class="flex items-center justify-between p-4 border-t border-slate-100 hover:bg-slate-50 transition-all text-sm"><span class="font-bold text-slate-700 truncate mr-6">${a.isPinned ? '📌 ' : ''}${escapeHTML(a.title)}</span><div class="flex shrink-0 gap-4"><button data-action="pin" data-id="${safeId}" data-pinned="${Boolean(a.isPinned)}" class="text-indigo-600 font-bold text-xs">${a.isPinned ? '取消置顶' : '置顶'}</button><button data-action="edit" data-id="${safeId}" class="text-indigo-600 font-bold text-xs">编辑</button><button data-action="delete" data-id="${safeId}" class="text-red-500 font-bold text-xs">删除</button></div></div>`;
                }).join('');
                document.querySelectorAll('#admin-table-body button[data-action]').forEach(button => {
                    button.addEventListener('click', () => {
                        const { action, id, pinned } = button.dataset;
                        if (action === 'pin') window.togglePin(id, pinned === 'true');
                        if (action === 'edit') window.openEditor(id);
                        if (action === 'delete') window.deletePost(id);
                    });
                });
                if (location.hash.includes('article')) updateUIFromHash();
            }, error => {
                console.error('文章加载失败', error);
                document.getElementById('article-list').innerHTML = '<p class="text-slate-400">文章暂时无法加载，请稍后刷新。</p>';
            });
        }
        window.togglePin = async (id, currentPinned) => { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', id), { isPinned: !currentPinned }); } catch (e) {} };
        window.deletePost = id => { if(confirm("确定永久删除博文？")) deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', id)); };

        // --- 图片/编辑器 ---
        const MAX_UPLOAD_BYTES = 10 * 1024 * 1024;
        const compressImage = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = reject;
            reader.onload = event => {
                const image = new Image();
                image.onerror = reject;
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(1, 1000 / image.width);
                    canvas.width = Math.round(image.width * scale);
                    canvas.height = Math.round(image.height * scale);
                    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('图片压缩失败')), 'image/jpeg', 0.7);
                };
                image.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        const uploadMedia = async (file, typeName) => {
            if (!file) return;
            if (file.size > MAX_UPLOAD_BYTES) return alert('文件不能超过 10 MB。');
            if (typeName === '图片' && !file.type.startsWith('image/')) return alert('请选择图片文件。');
            const uploadFile = typeName === '图片' ? await compressImage(file) : file;
            const path = `media/${Date.now()}-${crypto.randomUUID?.() || Math.random().toString(36).slice(2)}-${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
            const task = uploadBytesResumable(ref(storage, path), uploadFile, { contentType: typeName === '图片' ? 'image/jpeg' : (file.type || 'application/octet-stream') });
            const btn = document.getElementById('post-submit-btn'); btn.disabled = true; btn.innerText = '正在上传 0%';
            try {
                await new Promise((resolve, reject) => task.on('state_changed', snapshot => {
                    btn.innerText = `正在上传 ${Math.round(snapshot.bytesTransferred / snapshot.totalBytes * 100)}%`;
                }, reject, resolve));
                const url = await getDownloadURL(task.snapshot.ref);
                insertPlaceholder(url, typeName, file.name);
            } catch (error) {
                console.error('上传失败', error); alert('上传失败，请稍后重试。');
            } finally { btn.disabled = false; btn.innerText = '发布同步'; }
        };
        const insertPlaceholder = (realCode, typeName, fileName = '') => {
            const textarea = document.getElementById('post-content');
            const count = Object.keys(window.tempMediaMap).length + 1, placeholder = `[[${typeName}${count}]]`;
            window.tempMediaMap[placeholder] = typeName === "图片" ? `<img src="${realCode}">` : `<a href="${realCode}" download="${fileName}">附件：${fileName}</a>`;
            const s = textarea.selectionStart, e = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, s) + placeholder + textarea.value.substring(e);
        };
        window.openEditor = (id = null) => {
            window.tempMediaMap = {};
            if(id){
                const a = articles.find(x => x.id === id); document.getElementById('edit-id').value = a.id;
                document.getElementById('post-title').value = a.title; document.getElementById('post-summary').value = a.summary;
                let cleanContent = a.content, idx = 1;
                const mediaRegex = /<img src="data:image[^>]+>|<a href="data:[^>]+>[^<]+<\/a>/g;
                let match; while ((match = mediaRegex.exec(a.content)) !== null) {
                    const placeholder = `[[${match[0].startsWith('<img') ? '图片' : '文件'}${idx}]]`;
                    window.tempMediaMap[placeholder] = match[0]; cleanContent = cleanContent.replace(match[0], placeholder); idx++;
                }
                document.getElementById('post-content').value = cleanContent;
            } else { document.getElementById('edit-id').value = ""; document.getElementById('post-title').value = ""; document.getElementById('post-summary').value = ""; document.getElementById('post-content').value = ""; }
            window.showView('editor');
        };
        window.submitPost = async () => {
            const btn = document.getElementById('post-submit-btn'); btn.disabled = true;
            let finalContent = document.getElementById('post-content').value;
            for (const [p, r] of Object.entries(window.tempMediaMap)) finalContent = finalContent.replace(p, r);
            const dateStr = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g,'.');
            const data = { title: document.getElementById('post-title').value, date: dateStr, summary: document.getElementById('post-summary').value, content: finalContent, updatedAt: Timestamp.now() };
            try { if(document.getElementById('edit-id').value) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', document.getElementById('edit-id').value), data); else await addDoc(articlesCol, { ...data, isPinned: false }); window.showView('admin'); } catch (err) { alert("保存失败！内容过大！"); } finally { btn.disabled = false; }
        };

        // --- 辅助功能 ---
        function startCommentsListener() { onSnapshot(commentsCol, s => { comments = s.docs.map(d => ({id: d.id, ...d.data()})); if (currentArticleId) renderComments(); }); }
        function renderComments() {
            const listEl = document.getElementById('comments-list'); if (!listEl) return;
            const filtered = comments.filter(c => c.articleId === currentArticleId).sort((a, b) => b.timestamp?.toMillis() - a.timestamp?.toMillis());
            if (filtered.length === 0) { listEl.innerHTML = '<p class="text-slate-400 text-center py-8 italic font-bold">暂无足迹记录。</p>'; return; }
            listEl.innerHTML = filtered.map(c => {
                const dateStr = c.timestamp?.toDate().toLocaleString('zh-CN', {year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
                return `<div class="p-4 bg-slate-50 rounded-lg border border-slate-100 text-left"><div class="flex justify-between items-start mb-2"><span class="font-bold text-slate-800 text-sm">${escapeHTML(c.name || '访客')}</span><div class="flex items-center gap-3"><span class="text-[10px] text-slate-400">${dateStr}</span>${isAdminAuthenticated || (user && c.uid === user.uid) ? `<button onclick="window.deleteComment('${c.id}')" class="text-slate-300 hover:text-red-500"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg></button>` : ''}</div></div><p class="text-slate-600 text-sm">${escapeHTML(c.content)}</p></div>`;
            }).join('');
        }
        window.deleteComment = async (id) => { if(confirm("删除？")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'comments', id)); };
        window.submitComment = async () => {
            const n = document.getElementById('comment-name').value.trim(), c = document.getElementById('comment-content').value.trim();
            const website = document.getElementById('comment-website').value.trim();
            if (!c || !currentArticleId || website) return;
            if (!user) return alert('评论服务正在连接，请稍后重试。');
            const cooldownKey = 'blog-comment-cooldown';
            const lastCommentAt = Number(localStorage.getItem(cooldownKey) || 0);
            if (Date.now() - lastCommentAt < 60_000) return alert('请一分钟后再发表评论。');
            const btn = document.getElementById('comment-submit-btn'); btn.disabled = true;
            try {
                await addDoc(commentsCol, { articleId: currentArticleId, name: n || '访客', content: c, timestamp: Timestamp.now(), uid: user.uid });
                localStorage.setItem(cooldownKey, String(Date.now()));
                document.getElementById('comment-content').value = "";
            } catch (error) {
                console.error('评论提交失败', error);
                alert('评论未发送成功，请确认网络连接后重试。');
            } finally { btn.disabled = false; }
        };

        // --- 模拟器 (修复变量引用与点绘制) ---
        const cvs = document.getElementById('compoundCanvas'), cx = cvs.getContext('2d'), tooltip = document.getElementById('chart-tooltip');
        function renderChart() {
            if (!cvs) return; const w = cvs.width = cvs.parentElement.clientWidth, h = 240; cvs.height = h;
            const p = parseFloat(document.getElementById('inputPrincipal').value) || 0, m = parseFloat(document.getElementById('inputMonthly').value) || 0, yrs = parseInt(document.getElementById('yearsInput').value), r = parseInt(document.getElementById('rateInput').value) / 100;
            let currentChartData = [{year: 0, principal: p, wealth: p, interest: 0}]; let cur = p;
            for(let i = 1; i <= yrs; i++) { 
                cur = cur * (1 + r) + (m * 12); 
                let inv = p + (m * 12 * i); 
                currentChartData.push({ year: i, principal: inv, wealth: cur, interest: Math.max(0, cur - inv) }); 
            }
            const max = currentChartData[currentChartData.length-1].wealth || 1; document.getElementById('finalWealth').innerText = `¥${Math.round(max).toLocaleString()}`;
            cx.clearRect(0,0,w,h); cx.strokeStyle = '#f1f5f9'; cx.lineWidth=1; cx.setLineDash([5,5]); for(let i=1;i<5;i++){ cx.beginPath(); cx.moveTo(0,h-(i*h/5)); cx.lineTo(w,h-(i*h/5)); cx.stroke(); }
            cx.setLineDash([]); cx.beginPath(); cx.moveTo(0,h); currentChartData.forEach(d=>cx.lineTo((d.year/yrs)*w,h-(d.principal/max)*(h-50)-25)); cx.lineTo(w,h); cx.fillStyle='rgba(99,102,241,0.5)'; cx.fill();
            cx.beginPath(); cx.moveTo(0,h); currentChartData.forEach(d=>cx.lineTo((d.year/yrs)*w,h-(d.wealth/max)*(h-50)-25)); for(let i=currentChartData.length-1; i>=0; i--){ cx.lineTo((currentChartData[i].year/yrs)*w,h-(currentChartData[i].principal/max)*(h-50)-25); } cx.fillStyle='rgba(16,185,129,0.15)'; cx.fill();
            cx.beginPath(); cx.strokeStyle='#4f46e5'; cx.lineWidth=3; cx.lineCap='round'; currentChartData.forEach((d,i)=>{ const x=(d.year/yrs)*w, y=h-(d.wealth/max)*(h-50)-25; if(i===0) cx.moveTo(x,y); else cx.lineTo(x,y); }); cx.stroke();
            window.lastData = currentChartData;
        }

        const handleChartMove = e => {
            const rect = cvs.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left, yrs = parseInt(document.getElementById('yearsInput').value);
            const yr = Math.round((x / cvs.width) * yrs); const d = (window.lastData || []).find(p => p.year === yr);
            if(d) {
                const max = window.lastData[window.lastData.length-1].wealth; 
                const px = (d.year/yrs)*cvs.width, py = 240 - (d.wealth/max)*(240-50)-25;
                tooltip.classList.remove('hidden'); tooltip.style.left = (px > cvs.width - 150 ? px - 180 : px + 20) + 'px'; tooltip.style.top = (py - 100) + 'px';
                tooltip.innerHTML = `<div class="font-bold text-indigo-300 border-b border-white/10 pb-2 mb-3 text-[10px]">第 ${d.year} 年预期</div><div class="flex justify-between gap-6 mb-1 text-[11px]"><span>本金:</span><span>¥${Math.round(d.principal).toLocaleString()}</span></div><div class="flex justify-between gap-6 mb-1 text-emerald-400 text-[11px]"><span>利息:</span><span>¥${Math.round(d.interest).toLocaleString()}</span></div><div class="flex justify-between gap-6 border-t border-white/10 mt-2 pt-2 text-white font-bold text-xs"><span>总计:</span><span>¥${Math.round(d.wealth).toLocaleString()}</span></div>`;
                renderChart(); cx.beginPath(); cx.fillStyle = '#4f46e5'; cx.arc(px, py, 10, 0, Math.PI * 2); cx.fill(); cx.strokeStyle = 'white'; cx.lineWidth = 3; cx.stroke();
            }
        };
        cvs.onmousemove = handleChartMove; cvs.ontouchmove = handleChartMove;
        cvs.onmouseleave = cvs.ontouchend = () => { tooltip.classList.add('hidden'); renderChart(); };
        ['yearsInput','rateInput','inputPrincipal','inputMonthly'].forEach(id => document.getElementById(id)?.addEventListener('input', (e) => { const vEl = document.getElementById(id.replace('Input','Val')); if(vEl) vEl.innerText = e.target.value; renderChart(); }));

        // --- 初始化 ---
        onAuthStateChanged(auth, async (u) => { user = u; isAdminAuthenticated = Boolean(u && !u.isAnonymous); if (user) { startDataListener(); startSettingsListener(); startCommentsListener(); } });
        getRedirectResult(auth).catch(error => {
            if (error.code) alert('登录失败：' + error.code);
        });
        (async () => {
            try { await signInAnonymously(auth); }
            catch (error) { console.warn('Firebase Access Restricted', error); }
        })();

        window.addEventListener('load', () => { 
            document.getElementById('image-upload')?.addEventListener('change', (e)=>uploadMedia(e.target.files[0], '图片'));
            document.getElementById('file-upload')?.addEventListener('change', (e)=>uploadMedia(e.target.files[0], '附件'));
            document.getElementById('post-content')?.addEventListener('paste', (e) => { const items = (e.clipboardData || e.originalEvent.clipboardData).items; for (const item of items) { if (item.type.indexOf('image') !== -1) { e.preventDefault(); processImageFile(item.getAsFile()); } } });
            if (location.hash) updateUIFromHash(); renderChart(); 
        });

        setInterval(() => { 
            const tgt = new Date('2026-12-20'), start = new Date('2026-01-01'), now = new Date(); const days = Math.ceil((tgt-now)/86400000); const pct = Math.min(100, Math.max(0, ((now-start)/(tgt-start))*100)); 
            const cEl = document.getElementById('countdown'); if(cEl) cEl.innerText = days + ' 天';
            const bEl = document.getElementById('progress-bar'); if(bEl) bEl.style.width = pct + '%'; 
            const tEl = document.getElementById('progress-text'); if(tEl) tEl.innerText = `已完成 2026 奋斗进度的 ${pct.toFixed(1)}%`;
        }, 1000);
    </script>
</body>
</html>
